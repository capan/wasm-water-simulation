<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link
      rel="stylesheet"
      href="https://unpkg.com/leaflet@1.7.1/dist/leaflet.css"
      integrity="sha512-xodZBNTC5n17Xt2atTPuE1HxjVMSvLVW9ocqUKLsCC5CXdbqCmblAshOMAS6/keqq/sMZMZ19scR4PsZChSR7A=="
      crossorigin=""
    />
    <script
      src="https://unpkg.com/leaflet@1.7.1/dist/leaflet.js"
      integrity="sha512-XQoYMqMTK8LvdxXYG3nZ448hOEQiglfqkJs1NOQV44cWnUrBc8PkAOcXy20w0vlaXaVUearIOBhiXZ5V3ynxwA=="
      crossorigin=""
    ></script>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'><text y='13' font-size='14'>💧</text></svg>" />

    <title>Water Simulation</title>
    <style>
      :root {
        --ink: #e8edf3;
        --dim: #9aa7b6;
        --panel: rgba(18, 22, 28, 0.82);
        --line: rgba(255, 255, 255, 0.12);
        --accent: #29a3ff;
        --warn: #f0a24a;
        --mono: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
      }

      * { box-sizing: border-box; }

      html, body { height: 100%; }
      body {
        margin: 0;
        background: #0d1117;
        color: var(--ink);
        font: 14px/1.45 system-ui, -apple-system, "Segoe UI", sans-serif;
        -webkit-font-smoothing: antialiased;
        overflow: hidden;
      }

      /* The map is the app. Everything else floats over it. */
      #map { position: fixed; inset: 0; background: #0d1117; }
      #map.selecting, #map.selecting .leaflet-grab { cursor: crosshair; }
      #map.dropping, #map.dropping .leaflet-grab { cursor: cell; }

      .leaflet-container { background: #0d1117; font: inherit; }
      .leaflet-control-zoom { border: none !important; }
      .leaflet-control-zoom a {
        background: var(--panel);
        color: var(--ink);
        border-color: var(--line);
      }
      .leaflet-control-zoom a:hover { color: var(--accent); }
      .leaflet-control-attribution {
        background: var(--panel) !important;
        color: var(--dim) !important;
        font-size: 11px;
      }
      .leaflet-control-attribution a { color: var(--dim) !important; }
      .sim-overlay { image-rendering: pixelated; }

      /* -------------------------------------------------------------- dock */

      .dock {
        position: fixed;
        left: 50%;
        bottom: 18px;
        transform: translateX(-50%);
        z-index: 1000;
        display: flex;
        align-items: center;
        gap: 12px;
        flex-wrap: wrap;
        justify-content: center;
        max-width: calc(100vw - 32px);
        padding: 9px 14px;
        background: var(--panel);
        border: 1px solid var(--line);
        border-radius: 12px;
        backdrop-filter: blur(14px);
      }
      .dock .sep { width: 1px; height: 22px; background: var(--line); }
      .dock label { display: flex; align-items: center; gap: 7px; white-space: nowrap; }
      .dock .name { color: var(--dim); font-size: 13px; }

      button {
        font: inherit;
        font-weight: 500;
        color: var(--ink);
        background: rgba(255, 255, 255, 0.07);
        border: 1px solid var(--line);
        border-radius: 8px;
        padding: 5px 11px;
        cursor: pointer;
      }
      button:hover:not(:disabled) { background: rgba(255, 255, 255, 0.14); }
      button:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
      button:disabled { opacity: 0.35; cursor: not-allowed; }
      button.icon { width: 32px; padding: 5px 0; text-align: center; }
      button.on { background: var(--accent); border-color: var(--accent); color: #06263d; }

      input[type="range"] {
        appearance: none;
        width: 86px;
        height: 3px;
        border-radius: 2px;
        background: rgba(255, 255, 255, 0.2);
        cursor: pointer;
      }
      input[type="range"]::-webkit-slider-thumb {
        appearance: none;
        width: 13px; height: 13px;
        border-radius: 50%;
        background: var(--accent);
      }
      input[type="range"]::-moz-range-thumb {
        width: 13px; height: 13px; border: 0;
        border-radius: 50%;
        background: var(--accent);
      }
      input[type="range"]:disabled { opacity: 0.35; cursor: not-allowed; }

      input[type="checkbox"] {
        appearance: none;
        width: 32px; height: 18px;
        border-radius: 9px;
        background: rgba(255, 255, 255, 0.16);
        position: relative;
        cursor: pointer;
      }
      input[type="checkbox"]::after {
        content: "";
        position: absolute;
        top: 2px; left: 2px;
        width: 14px; height: 14px;
        border-radius: 50%;
        background: var(--dim);
        transition: transform 0.15s, background 0.15s;
      }
      input[type="checkbox"]:checked { background: rgba(41, 163, 255, 0.3); }
      input[type="checkbox"]:checked::after { transform: translateX(14px); background: var(--accent); }
      input[type="checkbox"]:disabled { opacity: 0.35; cursor: not-allowed; }

      output {
        font-family: var(--mono);
        font-size: 12px;
        font-variant-numeric: tabular-nums;
        color: var(--dim);
      }

      /* ------------------------------------------------------------ status */

      .status {
        position: fixed;
        left: 14px;
        top: 14px;
        z-index: 1000;
        max-width: min(46ch, calc(100vw - 28px));
        padding: 8px 12px;
        background: var(--panel);
        border: 1px solid var(--line);
        border-radius: 10px;
        backdrop-filter: blur(14px);
        font-size: 13px;
      }
      .status div { color: var(--dim); }
      .status div:first-child { color: var(--ink); }
      .status div:empty { display: none; }
      .status div.alert { color: var(--warn); }

      /* ------------------------------------------------------------ search */

      .search {
        position: fixed;
        left: 14px;
        top: 14px;
        z-index: 1001;
        width: min(300px, calc(100vw - 28px));
      }
      .search input {
        width: 100%;
        font: inherit;
        color: var(--ink);
        background: var(--panel);
        border: 1px solid var(--line);
        border-radius: 10px;
        padding: 8px 12px;
        backdrop-filter: blur(14px);
      }
      .search input::placeholder { color: var(--dim); }
      .search input:focus { outline: none; border-color: var(--accent); }

      .search ul {
        list-style: none;
        margin: 6px 0 0;
        padding: 4px;
        max-height: 44vh;
        overflow-y: auto;
        background: var(--panel);
        border: 1px solid var(--line);
        border-radius: 10px;
        backdrop-filter: blur(14px);
      }
      .search ul:empty { display: none; }
      .search li {
        padding: 6px 9px;
        border-radius: 7px;
        cursor: pointer;
        font-size: 13px;
      }
      .search li[aria-selected="true"], .search li:hover { background: rgba(255, 255, 255, 0.1); }
      .search li small { display: block; color: var(--dim); font-size: 12px; }
      .search li.note { color: var(--dim); cursor: default; }
      .search li.note:hover { background: none; }

      /* The preset chips sit below the search input, and the status box below
         them — each row pushes the next one down rather than overlapping it. */
      .presets {
        position: fixed;
        left: 14px;
        top: 58px;
        z-index: 1000;
        display: flex;
        align-items: center;
        gap: 6px;
        flex-wrap: wrap;
        max-width: calc(100vw - 28px);
      }
      .presets span { color: var(--dim); font-size: 12px; white-space: nowrap; }
      .presets button { font-size: 12px; padding: 3px 9px; border-radius: 7px; white-space: nowrap; }

      .status { top: 96px; }

      /* Top-right is the only corner nothing else claims: the search and
         presets sit top-left, Leaflet's zoom bottom-right, the dock along
         the bottom. */
      .how {
        position: fixed;
        right: 14px;
        top: 14px;
        z-index: 1000;
        padding: 6px 11px;
        font-size: 0.84rem;
        color: var(--dim);
        text-decoration: none;
        background: var(--panel);
        border: 1px solid var(--line);
        border-radius: 8px;
        backdrop-filter: blur(14px);
      }
      .how:hover,
      .how:focus-visible {
        color: var(--ink);
      }

      /* Follows the pointer over the simulated area; placed from script. */
      .readout {
        position: fixed;
        z-index: 1000;
        display: none;
        padding: 6px 9px;
        background: var(--panel);
        border: 1px solid var(--line);
        border-radius: 8px;
        backdrop-filter: blur(14px);
        font-family: var(--mono);
        font-size: 12px;
        line-height: 1.6;
        pointer-events: none;
        white-space: nowrap;
      }
      .readout b { color: var(--accent); font-weight: 500; }
    </style>
  </head>
  <body>
    <div id="map"></div>

    <a class="how" href="/how">How it works</a>

    <div class="search">
      <input id="place-search" type="search" autocomplete="off" spellcheck="false"
             placeholder="Search for a place" aria-label="Search for a place"
             role="combobox" aria-expanded="false" aria-controls="place-results" />
      <ul id="place-results" role="listbox" aria-label="Search results"></ul>
    </div>

    <div class="presets" id="presets">
      <span>Try:</span>
    </div>

    <div class="status">
      <div id="status"></div>
      <div id="rain-status"></div>
      <div id="soil-status"></div>
    </div>

    <div class="readout" id="readout"></div>

    <div class="dock">
      <button id="select-area">Select area</button>

      <span class="sep"></span>
      <button id="play-pause" class="icon" title="Play or pause" disabled>▶</button>
      <button id="step" class="icon" title="One tick" disabled>⏭</button>
      <label>
        <span class="name">Speed</span>
        <input id="tick-range" min="0" max="100" type="range" value="70" disabled />
        <output id="speed-display">–</output>
      </label>
      <output id="iteration" title="Water cells">0</output>

      <span class="sep"></span>
      <label title="Spawn droplets where it is raining">
        <input id="rain-toggle" type="checkbox" checked disabled />
        <span class="name">Rain</span>
      </label>
      <label title="Override the radar with even rain everywhere">
        <input id="rain-mm" min="0" max="200" step="1" type="range" value="0" disabled />
        <output id="rain-mm-display">off</output>
      </label>

      <span class="sep"></span>
      <label title="Let the ground absorb water">
        <input id="soil-toggle" type="checkbox" checked disabled />
        <span class="name">Soil</span>
      </label>

      <span class="sep"></span>
      <button id="replay" class="icon" title="Replay the last two hours" disabled>▶</button>
      <input id="frame-range" min="0" max="0" type="range" value="0" disabled />
      <output id="frame-time">live</output>
      <output id="radar-age"></output>
    </div>

    <script src="./bootstrap.js"></script>
  </body>
</html>
